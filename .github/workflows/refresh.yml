name: Katalogu yenile (TV + radyo)

# Yayin adresleri zamanla oluyor. Bu is akisi haftada bir tum kaynaklari
# yeniden indirir, her yayini test eder ve yalnizca calisanlari isler.
on:
  schedule:
    - cron: '0 4 * * 1'      # her pazartesi 04:00 UTC
  workflow_dispatch:          # elle de tetiklenebilir

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kaynak listeleri indir
        run: |
          set -euo pipefail
          mkdir -p data/src

          # iptv-org ulke listeleri  (Birlesik Krallik "uk" kodunda)
          for c in us es mx ar tr; do
            curl -fsSL --retry 3 -o "data/iptvorg_$c.m3u" \
              "https://iptv-org.github.io/iptv/countries/$c.m3u"
          done
          curl -fsSL --retry 3 -o data/iptvorg_gb.m3u \
            "https://iptv-org.github.io/iptv/countries/uk.m3u"

          # iptv-org API — ayni kanalin alternatif adresleri
          curl -fsSL --retry 3 -o data/api_streams.json  "https://iptv-org.github.io/api/streams.json"
          curl -fsSL --retry 3 -o data/api_channels.json "https://iptv-org.github.io/api/channels.json"

          # FAST servisleri (Pluto TV, Samsung TV Plus, Plex, Roku, Tubi)
          B=https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists
          for f in plutotv_us plutotv_es plutotv_gb plutotv_mx plutotv_ar \
                   samsungtvplus_us samsungtvplus_es samsungtvplus_gb \
                   plex_us plex_es plex_gb plex_mx roku_all tubi_all; do
            curl -fsSL --retry 3 -o "data/src/$f.m3u" "$B/$f.m3u" || echo "atlandi: $f"
          done

          # Free-TV
          F=https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists
          set -- usa:us spain:es uk:gb mexico:mx argentina:ar turkey:tr
          for pair in "$@"; do
            name=${pair%%:*}; co=${pair##*:}
            curl -fsSL --retry 3 -o "data/src/freetv_$co.m3u" \
              "$F/playlist_$name.m3u8" || echo "atlandi: $name"
          done

      - name: Adaylari birlestir
        run: node merge-sources.mjs

      - name: Yayinlari test et
        run: |
          set -euo pipefail
          for c in us gb es mx ar tr; do
            echo "::group::$c"
            node test-streams.mjs "data/cand_$c.m3u" "data/results_$c.json"
            node retest.mjs "data/results_$c.json"
            echo "::endgroup::"
          done

      - name: Katalog, altyazi ve yayin akisi
        run: |
          node build-catalog.mjs
          node probe-cc.mjs
          node build-epg.mjs

      - name: Radyo istasyonlari
        run: |
          node fetch-radio.mjs
          for c in us gb es mx ar tr; do
            echo "::group::radyo $c"
            node test-radio.mjs "$c"
            echo "::endgroup::"
          done
          node build-radio.mjs

      - name: Guvenlik denetimi
        run: node guvenlik-denetimi.mjs

      - name: Degisiklikleri isle
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/channels.json public/epg.json public/radio.json public/TV*.m3u
          if git diff --cached --quiet; then
            echo "degisiklik yok"
          else
            n=$(node -p "require('./public/channels.json').total")
            r=$(node -p "require('./public/radio.json').total")
            git commit -m "Katalog yenilendi: $n kanal, $r radyo"
            git push
          fi
