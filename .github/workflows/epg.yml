name: Yayin akisini yenile (EPG)

# epg.json yalnizca ~14 saatlik programi tasir. Haftalik tam yenileme
# aralarinda bosluk birakiyordu; bu is akisi gunde iki kez sadece EPG"yi
# yeniden uretir (birkac dakika surer, kanal testi calistirmaz).
on:
  schedule:
    - cron: '10 3,15 * * *'   # 03:10 ve 15:10 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: EPG uret
        run: node build-epg.mjs

      - name: Isle
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/epg.json
          if git diff --cached --quiet; then
            echo "degisiklik yok"
          else
            n=$(node -p "Object.keys(require('./public/epg.json').ch).length")
            git commit -m "Yayin akisi yenilendi: $n kanal"
            git push
          fi
