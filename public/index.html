<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortexia TV — Canlı Dünya Televizyonu</title>
<script src="/hls.min.js"></script>
<style>
  :root{
    --bg:#0b0d10; --bg2:#12151a; --bg3:#191d24; --line:#242a33;
    --fg:#e8ecf2; --dim:#8b95a5; --dim2:#5c6675;
    --acc:#e11d48; --acc2:#3b82f6; --ok:#22c55e;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit}

  #app{display:grid;grid-template-columns:250px 1fr;height:100vh}

  /* ---------- sidebar ---------- */
  aside{
    background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .brand{padding:16px 16px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
  .brand b{font-size:15px;letter-spacing:.2px}
  .brand .flag{font-size:19px}
  .brand small{display:block;color:var(--dim2);font-size:11px;font-weight:400}
  /* TV / Radyo geçişi */
  #modes{display:flex;gap:4px;margin:10px 12px 0;padding:3px;border-radius:10px;background:var(--bg3);border:1px solid var(--line)}
  .md{flex:1;padding:6px 8px;border-radius:7px;color:var(--dim);font-size:12.5px;font-weight:500;transition:.12s}
  .md:hover{color:var(--fg)}
  .md.on{background:var(--acc);color:#fff}
  /* radyo oynatıcı paneli */
  #stage.radio .vidbox{aspect-ratio:auto;height:132px;max-height:132px;
    background:linear-gradient(135deg,#141922,#0d1014);display:flex;align-items:center;gap:16px;padding:0 22px}
  #stage.radio video{width:0;height:0;position:absolute;opacity:0}
  #rpanel{display:none;align-items:center;gap:16px;width:100%;min-width:0}
  #stage.radio #rpanel{display:flex}
  #rlogo{width:76px;height:76px;border-radius:12px;background:#0b0e13;display:grid;place-items:center;
    flex-shrink:0;overflow:hidden;border:1px solid var(--line)}
  #rlogo img{max-width:86%;max-height:86%;object-fit:contain}
  #rlogo .ph{font-size:22px;font-weight:700;color:#4b5563}
  #rmeta{min-width:0;flex:1}
  #rname{font-size:17px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #rsub{font-size:11.5px;color:var(--dim2)}
  /* ses çubukları */
  .eq{display:flex;align-items:flex-end;gap:3px;height:34px;flex-shrink:0}
  .eq i{width:4px;background:var(--acc);border-radius:2px;height:20%;animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
  .eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
  @keyframes eq{0%,100%{height:22%}50%{height:100%}}
  .eq.off i{animation-play-state:paused;height:22%;background:var(--dim2)}
  /* ülke seçici */
  #countries{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:10px 12px 2px}
  .co{
    display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:6px 2px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);
    color:var(--dim);transition:.12s;
  }
  .co:hover{color:var(--fg);border-color:#39424f}
  .co.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .co .fl{font-size:16px;line-height:1.15}
  .co .qty{font-size:9.5px;opacity:.8;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
  .searchwrap{padding:12px}
  .searchwrap input{
    width:100%;padding:9px 11px;border-radius:var(--r);
    background:var(--bg3);border:1px solid var(--line);color:var(--fg);outline:none;
  }
  .searchwrap input:focus{border-color:var(--acc2)}
  nav{flex:1;overflow-y:auto;padding:0 8px 8px}
  .cat{
    display:flex;align-items:center;gap:9px;width:100%;
    padding:9px 10px;border-radius:var(--r);color:var(--dim);text-align:left;
  }
  .cat:hover{background:var(--bg3);color:var(--fg)}
  .cat.on{background:var(--acc);color:#fff}
  .cat .n{margin-left:auto;font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
  .cat .ic{width:18px;text-align:center}
  .sep{height:1px;background:var(--line);margin:8px 10px}
  .toggles{padding:8px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .tg{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px;cursor:pointer}
  .tg input{accent-color:var(--acc)}
  .foot{padding:8px 12px 12px;color:var(--dim2);font-size:11px;line-height:1.6}
  .foot a{color:var(--dim);text-decoration:none}
  .foot a:hover{color:var(--acc2)}

  /* ---------- main ---------- */
  main{display:flex;flex-direction:column;min-width:0;min-height:0}

  /* ---------- player ---------- */
  #stage{background:#000;border-bottom:1px solid var(--line);display:none;flex-shrink:0}
  #stage.on{display:block}
  .vidbox{position:relative;background:#000;width:100%;aspect-ratio:16/9;max-height:56vh;margin:0 auto}
  .vidbox video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
  /* altyazı okunabilirliği (İngilizce pratiği için önemli) */
  video::cue{
    background:rgba(0,0,0,.78);color:#fff;font-size:1.05em;line-height:1.45;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;text-shadow:0 1px 2px #000;
  }
  #spin{
    position:absolute;inset:0;display:none;place-items:center;
    background:rgba(0,0,0,.55);color:var(--dim);font-size:13px;z-index:3;
  }
  #spin.on{display:grid}
  .sp{width:34px;height:34px;border:3px solid #2a3140;border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #errbox{
    position:absolute;inset:0;display:none;place-items:center;text-align:center;
    background:rgba(0,0,0,.82);z-index:4;padding:20px;
  }
  #errbox.on{display:grid}
  #errbox h4{margin:0 0 6px;color:#ff6b81;font-size:15px}
  #errbox p{margin:0 0 14px;color:var(--dim);font-size:12.5px;max-width:430px}
  .ebtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .ebtn{padding:8px 15px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);font-size:12.5px}
  .ebtn:hover{background:#20262f}
  .ebtn.pri{background:var(--acc);border-color:var(--acc);color:#fff}

  .bar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--bg2);flex-wrap:wrap}
  .bar .title{font-weight:600;font-size:14px;margin-right:2px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live{
    display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
    letter-spacing:.6px;color:#fff;background:var(--acc);padding:2.5px 7px;border-radius:4px;
  }
  .live i{width:5px;height:5px;background:#fff;border-radius:50%;animation:bl 1.4s infinite}
  @keyframes bl{50%{opacity:.25}}
  .cbtn{
    padding:6px 10px;border-radius:7px;background:var(--bg3);border:1px solid var(--line);
    font-size:12px;color:var(--dim);display:inline-flex;align-items:center;gap:5px;
  }
  .cbtn:hover{color:var(--fg);border-color:#333c49}
  .cbtn.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
  .cbtn.fav.on{background:#f59e0b;border-color:#f59e0b;color:#101010}
  .spacer{flex:1}
  select.cbtn{appearance:none;padding-right:22px;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 13px) 12px,calc(100% - 8px) 12px;background-size:5px 5px;background-repeat:no-repeat}
  #vol{width:82px;accent-color:var(--acc)}
  .stat{font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- grid ---------- */
  .listhead{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
  .listhead h2{margin:0;font-size:15px;font-weight:600}
  .listhead .cnt{color:var(--dim2);font-size:12px}
  #grid{
    flex:1;overflow-y:auto;padding:4px 18px 24px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px;align-content:start;
  }
  .card{
    background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
    padding:11px;cursor:pointer;position:relative;transition:transform .12s,border-color .12s;
    display:flex;flex-direction:column;gap:8px;
  }
  .card:hover{transform:translateY(-2px);border-color:#39424f;background:var(--bg3)}
  .card.playing{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .thumb{
    height:60px;display:grid;place-items:center;background:#0e1116;border-radius:7px;overflow:hidden;
  }
  .thumb img{max-width:88%;max-height:50px;object-fit:contain}
  .thumb .ph{font-size:17px;font-weight:700;color:#4b5563;letter-spacing:.5px}
  .cname{font-size:12.5px;font-weight:500;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
  .meta{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--dim2)}
  .tag{background:#1c222b;padding:1.5px 5px;border-radius:4px}
  .tag.hd{color:#6ee7b7;background:#0f2a20}
  .tag.cc{color:#93c5fd;background:#132036;font-weight:600}
  /* şu an yayında (EPG) */
  .now{
    font-size:10px;color:var(--dim2);line-height:1.3;min-height:13px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .now b{color:var(--dim);font-weight:500}
  #nowprog{font-size:11.5px;color:var(--dim);max-width:26vw;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* proxy yok uyarısı */
  #mode{
    display:none;align-items:center;gap:7px;margin:0 12px 8px;padding:7px 9px;
    border-radius:9px;background:#1a1508;border:1px solid #3a2f10;color:#e0b950;font-size:11px;line-height:1.4;
  }
  #mode.on{display:flex}
  .star{
    position:absolute;top:7px;right:7px;font-size:13px;opacity:0;transition:opacity .12s;
    width:22px;height:22px;border-radius:5px;background:rgba(0,0,0,.55);
  }
  .card:hover .star,.star.on{opacity:1}
  .star.on{color:#f59e0b}
  .empty{grid-column:1/-1;text-align:center;color:var(--dim2);padding:60px 20px;font-size:13px}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#252b34;border-radius:10px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#333b46}
  ::-webkit-scrollbar-track{background:transparent}

  #toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--bg3);border:1px solid var(--line);padding:9px 15px;border-radius:9px;
    font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;
  }
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:820px){
    #app{grid-template-columns:1fr}
    aside{position:fixed;inset:0 auto 0 0;width:250px;z-index:50;transform:translateX(-100%);transition:.2s}
    aside.open{transform:none}
    .bar .title{max-width:44vw}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <span class="flag" id="brandflag">📺</span>
      <b>Cortexia TV<small id="brandsub">yükleniyor…</small></b>
    </div>
    <div id="modes">
      <button class="md on" data-m="tv">📺 TV</button>
      <button class="md" data-m="radio">📻 Radyo</button>
    </div>
    <div id="countries"></div>
    <div id="mode">
      <span>⚡</span>
      <span>Doğrudan mod — <b id="modecount">0</b> kanal oynatılabilir.
      Tamamı için yerel sunucuyu çalıştır.</span>
    </div>
    <div class="searchwrap">
      <input id="q" type="search" placeholder="Kanal ara…  (/)" autocomplete="off" spellcheck="false">
    </div>
    <nav id="cats"></nav>
    <div class="toggles">
      <label class="tg" id="tg-hd"><input type="checkbox" id="hdonly"> Sadece HD (720p+)</label>
      <label class="tg" id="tg-cc"><input type="checkbox" id="cconly"> Sadece altyazılı kanallar</label>
      <label class="tg" id="tg-acc"><input type="checkbox" id="autocc" checked> Altyazıyı otomatik aç</label>
      <label class="tg" id="tg-hq" hidden><input type="checkbox" id="hqonly"> Sadece yüksek kalite (128k+)</label>
    </div>
    <div class="foot">
      <b style="color:var(--dim)">Kısayollar</b><br>
      Boşluk oynat/duraklat · F tam ekran · M sessiz<br>
      ↑↓ kanal değiştir · C altyazı · / arama<br>
      <a href="/TV.m3u" download>⬇ M3U listesini indir (VLC)</a>
    </div>
  </aside>

  <main>
    <section id="stage">
      <div class="vidbox">
        <video id="v" playsinline></video>
        <div id="rpanel">
          <div id="rlogo"></div>
          <div id="rmeta">
            <div id="rname">—</div>
            <div id="rsub"></div>
          </div>
          <div class="eq" id="req"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div id="spin"><div><div class="sp"></div><span id="spintext">Bağlanıyor…</span></div></div>
        <div id="errbox">
          <div>
            <h4 id="errtitle">Yayın açılamadı</h4>
            <p id="errmsg"></p>
            <div class="ebtns">
              <button class="ebtn pri" id="eretry">Tekrar dene</button>
              <button class="ebtn" id="enext">Sonraki kanal →</button>
            </div>
          </div>
        </div>
      </div>
      <div class="bar">
        <span class="live"><i></i>CANLI</span>
        <span class="title" id="nowname">—</span>
        <span id="nowprog"></span>
        <button class="cbtn fav" id="bfav" title="Favorilere ekle">☆</button>
        <div class="spacer"></div>
        <span class="stat" id="stat"></span>
        <select class="cbtn" id="qual" title="Görüntü kalitesi"></select>
        <select class="cbtn" id="audio" title="Ses dili"></select>
        <button class="cbtn" id="bcc" title="Altyazı (C)">CC</button>
        <button class="cbtn" id="bmute" title="Sessiz (M)">🔊</button>
        <input id="vol" type="range" min="0" max="1" step="0.02" value="1">
        <button class="cbtn" id="bpip" title="Mini pencere">⧉</button>
        <button class="cbtn" id="bfs" title="Tam ekran (F)">⛶</button>
        <button class="cbtn" id="bclose" title="Kapat">✕</button>
      </div>
    </section>

    <div class="listhead">
      <h2 id="lhname">Popüler</h2>
      <span class="cnt" id="lhcount"></span>
    </div>
    <div id="grid"></div>
  </main>
</div>
<div id="toast"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const CATS_RADIO = [
  { k: "fav",        ic: "★",  label: "Favoriler" },
  { k: "recent",     ic: "🕘", label: "Son dinlenenler" },
  { k: "all",        ic: "▦",  label: "Tüm istasyonlar" },
  { k: "haber",      ic: "📰", label: "Haber / Söz" },
  { k: "spor",       ic: "⚽", label: "Spor" },
  { k: "pop",        ic: "🎤", label: "Pop / Hit" },
  { k: "rock",       ic: "🎸", label: "Rock" },
  { k: "klasik",     ic: "🎻", label: "Klasik" },
  { k: "caz",        ic: "🎷", label: "Caz / Blues" },
  { k: "elektronik", ic: "🎛", label: "Elektronik" },
  { k: "kultur",     ic: "📚", label: "Kültür" },
  { k: "yerel",      ic: "📍", label: "Yerel" },
  { k: "dini",       ic: "🕌", label: "Dini" },
  { k: "muzik",      ic: "🎵", label: "Müzik" },
];
const CATS_TV = [
  { k: "fav",      ic: "★", label: "Favoriler" },
  { k: "recent",   ic: "🕘", label: "Son izlenenler" },
  { k: "all",      ic: "▦", label: "Tüm kanallar" },
  { k: "haber",    ic: "📰", label: "Haber" },
  { k: "spor",     ic: "⚽", label: "Spor" },
  { k: "belgesel", ic: "🔬", label: "Belgesel" },
  { k: "dizi",     ic: "🎬", label: "Dizi" },
  { k: "film",     ic: "🎥", label: "Film" },
  { k: "cocuk",    ic: "🧸", label: "Çocuk" },
  { k: "eglence",  ic: "🎭", label: "Eğlence" },
  { k: "diger",    ic: "📻", label: "Diğer" },
];
let CATS = CATS_TV;

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("usatv." + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("usatv." + k, JSON.stringify(v)); } catch {} },
};

let ALL = [], VIEW = [], CUR = null, hls = null, META = [];
let MODE = store.get("mode", "tv");   // "tv" | "radio"
const isRadio = () => MODE === "radio";
let PROXY = false;          // yerel sunucu var mı (yoksa doğrudan oynatılır)
let EPG = null;             // { built, ch: { <kanal indeksi>: [[başlangıçDk, süreDk, başlık]] } }
let cat = store.get("cat", "all");
let CO = store.get("co", "us");
let retries = 0, statTimer = null;
let srcIdx = 0;             // o an denenen adres (0 = birincil, sonrası c.alt)

/** kanalın deneme sırasındaki adresleri: birincil + yedekler */
function urlsOf(c) {
  const list = [c.url, ...(c.alt || [])];
  return PROXY ? list : list.slice(0, 1);   // doğrudan modda yalnızca doğrulanmış birincil
}

// favori/geçmiş anahtarı ülkeyi de taşır (aynı ad iki ülkede olabilir)
const fkey = (c) => (c.co || "us") + "|" + c.name;
const migrate = (arr) => (arr || []).map(s => (s.includes("|") ? s : "us|" + s));
let favs = new Set(migrate(store.get("favs", [])));
let recent = migrate(store.get("recent", []));

/** o an seçili ülkenin kanalları / istasyonları */
const pool = () => ALL.filter(c => c.co === CO);

/**
 * Yerel sunucu yokken (statik web sürümü) oynatılabilir mi?
 *  TV    : yayın kendi CORS başlığını göndermeli (hls.js manifesti fetch ile okur)
 *  Radyo : sayfa https olduğundan yayın da https olmalı; HLS ise ayrıca CORS
 */
function webPlayable(c) {
  // t = sertifikası geçerli (https sayfada gecersiz sertifikali kaynak oynatilamaz)
  if (c.t === 0) return false;
  if (isRadio()) return !!c.s && (!c.hls || !!c.d);
  return !!c.d;
}

const esc = (s) => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const toast = (msg) => {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200);
};
const b64 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const proxied = (u) => (PROXY ? "/p/" + b64(u) : u);

/** o an yayında olan ve sonraki program */
function epgOf(ch) {
  if (!EPG || !EPG.ch) return null;
  const rows = EPG.ch[ch.i];
  if (!rows || !rows.length) return null;
  const now = Math.round(Date.now() / 60000);
  let cur = null, next = null;
  for (const [st, dur, title] of rows) {
    if (st <= now && now < st + dur) cur = { st, dur, title };
    else if (st > now && !next) next = { st, dur, title };
  }
  return cur || next ? { cur, next } : null;
}
const hhmm = (min) => {
  const d = new Date(min * 60000);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
};

// ---------------- boot ----------------
const CACHE = {};             // mod -> yüklenmiş katalog

async function loadCatalog(mode) {
  if (CACHE[mode]) return CACHE[mode];
  const file = mode === "radio" ? "radio.json" : "channels.json";
  const d = await (await fetch(file, { cache: "no-store" })).json();
  CACHE[mode] = { items: mode === "radio" ? d.stations : d.channels, countries: d.countries || [] };
  return CACHE[mode];
}

/** seçili moda göre listeyi, kategorileri ve ülkeleri kurar */
async function applyMode(first) {
  let data;
  try { data = await loadCatalog(MODE); }
  catch {
    $("#grid").innerHTML = '<div class="empty">' + (MODE === "radio" ? "radio.json" : "channels.json") +
      ' yüklenemedi.<br>Sunucuyu <code>Baslat.bat</code> ile çalıştırdığından emin ol.</div>';
    return;
  }
  if (!first) stop();
  ALL = data.items;
  CATS = isRadio() ? CATS_RADIO : CATS_TV;
  META = data.countries.length ? data.countries
       : [{ co: "us", flag: "🇺🇸", label: "ABD", total: ALL.length }];
  if (!META.some(m => m.co === CO)) CO = META[0].co;
  if (!CATS.some(c => c.k === cat)) cat = "all";

  document.querySelectorAll(".md").forEach(b => b.classList.toggle("on", b.dataset.m === MODE));
  $("#tg-hd").hidden = isRadio();
  $("#tg-cc").hidden = isRadio();
  $("#tg-acc").hidden = isRadio();
  $("#tg-hq").hidden = !isRadio();

  buildCountries();
  buildCats();
  render();

  if (!PROXY) {
    $("#modecount").textContent = ALL.filter(webPlayable).length;
    $("#mode").classList.add("on");
  }
}

(async function init() {
  // yerel sunucu (proxy) var mı? statik dağıtımda yok.
  try {
    const h = await fetch("/__local", { cache: "no-store", signal: AbortSignal.timeout(2500) });
    PROXY = h.ok;
  } catch { PROXY = false; }

  await applyMode(true);
  bindUI();

  // yayın akışı (yalnızca TV)
  fetch("epg.json", { cache: "no-store" })
    .then(r => (r.ok ? r.json() : null))
    .then(e => { EPG = e; if (e && !isRadio()) { render(); paintNow(); } })
    .catch(() => {});

  // #co=<ülke>&ch=<ad> ile doğrudan açılabilsin (Cortexia'dan derin bağlantı)
  openFromHash();
  window.addEventListener("hashchange", openFromHash);
})();

function openFromHash() {
  const m = /[#&]ch=([^&]+)/.exec(location.hash);
  if (!m) return;
  let want; try { want = decodeURIComponent(m[1]); } catch { return; }
  if (CUR && CUR.name === want) return;
  const co = (/[#&]co=([a-z]{2})/.exec(location.hash) || [])[1];
  const scope = co ? ALL.filter(x => x.co === co) : ALL;
  const w = want.toLowerCase();
  const c = scope.find(x => x.name === want) ||
            scope.find(x => x.name.toLowerCase() === w) ||
            scope.find(x => x.name.toLowerCase().includes(w));
  if (!c) return;
  if (c.co !== CO) {           // başka ülkenin kanalıysa oraya geç
    CO = c.co; store.set("co", CO);
    buildCountries(); buildCats(); render();
  }
  play(c);
}

function buildCountries() {
  const box = $("#countries");
  box.innerHTML = "";
  META.forEach(m => {
    const b = document.createElement("button");
    b.className = "co" + (m.co === CO ? " on" : "");
    b.title = m.label + " — " + m.total + " kanal";
    b.innerHTML = '<span class="fl">' + m.flag + '</span>' +
                  '<span class="qty">' + m.total + "</span>";
    b.onclick = () => {
      if (CO === m.co) return;
      CO = m.co; store.set("co", CO);
      $("#q").value = "";
      buildCountries(); buildCats(); render();
      toast(m.flag + " " + m.label + " — " + m.total + " kanal");
    };
    box.appendChild(b);
  });
  const m = META.find(x => x.co === CO);
  $("#brandflag").textContent = m ? m.flag : "📺";
  $("#brandsub").textContent = (m ? m.total : ALL.length) + " doğrulanmış kanal";
}

function countOf(k) {
  const P = pool();
  if (k === "all") return P.length;
  if (k === "fav") return P.filter(c => favs.has(fkey(c))).length;
  if (k === "recent") return P.filter(c => recent.includes(fkey(c))).length;
  return P.filter(c => c.cats.includes(k)).length;
}

function buildCats() {
  const nav = $("#cats");
  nav.innerHTML = "";
  CATS.forEach((c, i) => {
    if (i === 3) nav.appendChild(Object.assign(document.createElement("div"), { className: "sep" }));
    const b = document.createElement("button");
    b.className = "cat" + (c.k === cat ? " on" : "");
    b.dataset.k = c.k;
    b.innerHTML = '<span class="ic">' + c.ic + '</span><span>' + c.label + '</span><span class="n"></span>';
    b.onclick = () => { cat = c.k; store.set("cat", cat); $("#q").value = ""; buildCats(); render(); };
    nav.appendChild(b);
  });
  refreshCounts();
}
function refreshCounts() {
  document.querySelectorAll(".cat").forEach(b => {
    b.querySelector(".n").textContent = countOf(b.dataset.k) || "";
    b.classList.toggle("on", b.dataset.k === cat);
  });
}

// ---------------- grid ----------------
function render() {
  const q = $("#q").value.trim().toLowerCase();
  const hd = $("#hdonly").checked;
  const ccf = $("#cconly").checked;
  const P = pool();
  let list;
  if (q) list = P.filter(c => c.name.toLowerCase().includes(q));
  else if (cat === "all") list = P.slice();
  else if (cat === "fav") list = P.filter(c => favs.has(fkey(c)));
  else if (cat === "recent") list = recent.map(k => P.find(c => fkey(c) === k)).filter(Boolean);
  else list = P.filter(c => c.cats.includes(cat));
  if (hd) list = list.filter(c => c.h >= 720);
  if (ccf) list = list.filter(c => c.cc);
  if (!PROXY) list = list.filter(webPlayable);        // doğrudan modda oynatılabilenler
  if (isRadio() && $("#hqonly").checked) list = list.filter(c => (c.br || 0) >= 128);
  VIEW = list;

  const label = q ? '"' + $("#q").value.trim() + '" araması' : (CATS.find(c => c.k === cat) || {}).label;
  $("#lhname").textContent = label;
  $("#lhcount").textContent = list.length + " kanal";

  const g = $("#grid");
  g.innerHTML = "";
  if (!list.length) {
    g.innerHTML = '<div class="empty">' + (cat === "fav"
      ? "Henüz favori yok. Kanal kartındaki ☆ ile ekleyebilirsin."
      : cat === "recent" ? "Henüz kanal izlemedin." : "Sonuç bulunamadı.") + '</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  for (const c of list) frag.appendChild(card(c));
  g.appendChild(frag);
  g.scrollTop = 0;
}

function card(c) {
  const k = fkey(c);
  const el = document.createElement("div");
  el.className = "card" + (CUR && fkey(CUR) === k ? " playing" : "");
  el.dataset.key = k;

  const th = document.createElement("div");
  th.className = "thumb";
  if (c.logo) {
    const img = new Image();
    img.loading = "lazy"; img.alt = "";
    img.onerror = () => { th.innerHTML = ""; th.appendChild(ph(c.name)); };
    // proxy varsa üstünden (hotlink engeli olanlar için), yoksa doğrudan
    img.src = PROXY ? "/img?u=" + encodeURIComponent(c.logo) : c.logo;
    th.appendChild(img);
  } else th.appendChild(ph(c.name));

  const nm = document.createElement("div");
  nm.className = "cname"; nm.textContent = c.name;

  const mt = document.createElement("div");
  mt.className = "meta";
  if (isRadio()) {
    if (c.br) {
      const t = document.createElement("span");
      t.className = "tag" + (c.br >= 128 ? " hd" : "");
      t.textContent = c.br + "k";
      mt.appendChild(t);
    }
    if (c.codec) {
      const t = document.createElement("span");
      t.className = "tag"; t.textContent = c.codec;
      mt.appendChild(t);
    }
  }
  if (c.res) {
    const t = document.createElement("span");
    t.className = "tag" + (c.h >= 720 ? " hd" : "");
    t.textContent = c.h >= 1080 ? "1080p" : c.h >= 720 ? "720p" : c.res;
    mt.appendChild(t);
  }
  if (c.cc) {
    const cc = document.createElement("span");
    cc.className = "tag cc"; cc.textContent = "CC"; cc.title = "Altyazılı — İngilizce pratiği için ideal";
    mt.appendChild(cc);
  }
  const ct = document.createElement("span");
  ct.className = "tag";
  ct.textContent = (CATS.find(x => x.k === c.cats[0]) || { label: "TV" }).label;
  mt.appendChild(ct);

  const nw = document.createElement("div");
  nw.className = "now";
  if (!isRadio()) nw.dataset.epg = String(c.i);
  const e = isRadio() ? null : epgOf(c);
  if (e && e.cur) nw.innerHTML = "<b>▸ " + esc(e.cur.title) + "</b>";
  else if (e && e.next) nw.textContent = hhmm(e.next.st) + " " + e.next.title;
  mt.appendChild(nw);

  const st = document.createElement("button");
  st.className = "star" + (favs.has(k) ? " on" : "");
  st.textContent = favs.has(k) ? "★" : "☆";
  st.onclick = (e) => { e.stopPropagation(); toggleFav(k); };

  el.append(th, nm, mt, nw, st);
  el.onclick = () => play(c);
  return el;
}
function ph(name) {
  const d = document.createElement("div");
  d.className = "ph";
  d.textContent = name.replace(/[^A-Za-z0-9 ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2)
    .map(w => w[0]).join("").toUpperCase() || "TV";
  return d;
}

function toggleFav(k) {
  if (favs.has(k)) favs.delete(k); else favs.add(k);
  store.set("favs", [...favs]);
  refreshCounts();
  document.querySelectorAll(".card[data-key]").forEach(el => {
    if (el.dataset.key === k) {
      const s = el.querySelector(".star");
      s.classList.toggle("on", favs.has(k));
      s.textContent = favs.has(k) ? "★" : "☆";
    }
  });
  if (CUR && fkey(CUR) === k) syncFavBtn();
  if (cat === "fav") render();
}
function syncFavBtn() {
  const on = CUR && favs.has(fkey(CUR));
  $("#bfav").classList.toggle("on", !!on);
  $("#bfav").textContent = on ? "★" : "☆";
}

// ---------------- player ----------------
const V = $("#v");
const showSpin = (t) => { $("#spintext").textContent = t || "Bağlanıyor…"; $("#spin").classList.add("on"); };
const hideSpin = () => $("#spin").classList.remove("on");
const showErr = (t, m) => { $("#errtitle").textContent = t; $("#errmsg").textContent = m; $("#errbox").classList.add("on"); hideSpin(); };
const hideErr = () => $("#errbox").classList.remove("on");

function destroy() {
  if (hls) { try { hls.destroy(); } catch {} hls = null; }
  V.removeAttribute("src"); try { V.load(); } catch {}
  clearInterval(statTimer);
}

function play(c, keep) {
  CUR = c;
  if (!keep) { retries = 0; srcIdx = 0; }
  destroy(); hideErr(); showSpin();
  $("#stage").classList.add("on");
  $("#nowname").textContent = c.name;
  document.title = c.name + " — Cortexia " + (isRadio() ? "Radyo" : "TV");
  syncFavBtn();
  if (isRadio()) $("#nowprog").textContent = ""; else paintNow();
  $("#qual").innerHTML = ""; $("#audio").innerHTML = "";
  for (const id of ["#bcc", "#bpip", "#bfs"]) $(id).hidden = isRadio();
  document.querySelectorAll(".card").forEach(e => e.classList.toggle("playing", e.dataset.key === fkey(c)));

  recent = [fkey(c), ...recent.filter(n => n !== fkey(c))].slice(0, 60);
  store.set("recent", recent); refreshCounts();

  // Cortexia gibi bir üst pencereye gömülüyse hangi kanalın açıldığını bildir
  try {
    if (window.parent !== window) {
      window.parent.postMessage({ type: "usatv:channel", name: c.name, co: c.co, cats: c.cats, cc: !!c.cc }, "*");
    }
  } catch {}
  try { history.replaceState(null, "", "#co=" + c.co + "&ch=" + encodeURIComponent(c.name)); } catch {}

  const list = urlsOf(c);
  const raw = list[Math.min(srcIdx, list.length - 1)];
  const isHls = isRadio() ? !!c.hls : true;
  // Radyoda düz ses akışı (MP3/AAC/OGG) doğrudan verilir: <video src> CORS istemez.
  const src = isHls ? proxied(raw) : raw;

  $("#stage").classList.toggle("radio", isRadio());
  if (isRadio()) paintRadio(c);

  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({
      lowLatencyMode: false,
      enableWorker: true,
      backBufferLength: 60,
      maxBufferLength: 24,
      maxMaxBufferLength: 60,
      manifestLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 3,
      levelLoadingTimeOut: 20000,
      fragLoadingTimeOut: 30000,
      fragLoadingMaxRetry: 6,
      enableCEA708Captions: true,
      renderTextTracksNatively: true,   // altyazıyı tarayıcı çizsin
    });
    hls.on(Hls.Events.MANIFEST_PARSED, () => { fillQuality(); initSubs(); startPlay(); });
    hls.on(Hls.Events.LEVEL_SWITCHED, fillQuality);
    hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, fillAudio);
    hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, initSubs);
    hls.on(Hls.Events.ERROR, onHlsError);
    hls.loadSource(src);
    hls.attachMedia(V);
  } else if (!isHls || V.canPlayType("application/vnd.apple.mpegurl")) {
    V.src = src;
    V.onerror = () => showErr("Yayın açılamadı",
      (CUR ? CUR.name : "") + " yanıt vermiyor. Kaynak geçici olarak kapalı olabilir.");
    startPlay();
  } else {
    showErr("Tarayıcı desteklemiyor", "Chrome, Edge veya Firefox kullan.");
  }
  startStats();
}

function startPlay() {
  V.volume = parseFloat($("#vol").value);
  V.play().then(hideSpin).catch(() => {
    // autoplay engellendi -> sessize alıp tekrar dene
    V.muted = true; syncMute();
    V.play().then(() => { hideSpin(); toast("Otomatik oynatma için ses kapatıldı — 🔊 ile aç"); })
      .catch(() => showErr("Oynatma başlatılamadı", "Video alanına tıklayıp tekrar dene."));
  });
}

function onHlsError(evt, data) {
  if (!data.fatal) return;
  if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
    try { hls.recoverMediaError(); showSpin("Görüntü kurtarılıyor…"); return; } catch {}
  }
  if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
    // 1) varsa yedek adrese geç
    const list = CUR ? urlsOf(CUR) : [];
    if (srcIdx + 1 < list.length) {
      srcIdx++;
      showSpin("Yedek adrese geçiliyor… (" + (srcIdx + 1) + "/" + list.length + ")");
      setTimeout(() => { if (CUR) play(CUR, true); }, 400);
      return;
    }
    // 2) yedek yoksa aynı adresi yeniden dene
    if (retries < 2) {
      retries++;
      srcIdx = 0;
      showSpin("Bağlantı yeniden kuruluyor… (" + retries + "/2)");
      setTimeout(() => { if (CUR) play(CUR, true); }, 1200 * retries);
      return;
    }
  }
  showErr("Yayın açılamadı", (CUR ? CUR.name : "") + " şu anda yanıt vermiyor (" +
    (data.details || data.type) + "). Kaynak geçici olarak kapalı olabilir.");
}

function fillQuality() {
  if (!hls || !hls.levels || hls.levels.length < 2) { $("#qual").style.display = "none"; return; }
  $("#qual").style.display = "";
  const cur = hls.currentLevel;
  const opts = ['<option value="-1"' + (cur === -1 ? " selected" : "") + ">Oto</option>"];
  hls.levels.forEach((l, i) => {
    const lbl = l.height ? l.height + "p" : Math.round((l.bitrate || 0) / 1000) + "k";
    opts.push('<option value="' + i + '"' + (cur === i ? " selected" : "") + ">" + lbl + "</option>");
  });
  $("#qual").innerHTML = opts.join("");
}
function fillAudio() {
  const tr = hls ? hls.audioTracks || [] : [];
  if (tr.length < 2) { $("#audio").style.display = "none"; return; }
  $("#audio").style.display = "";
  // parça adları uzak manifestten gelir -> kaçışla
  $("#audio").innerHTML = tr.map((t, i) =>
    '<option value="' + i + '"' + (hls.audioTrack === i ? " selected" : "") + ">" +
    esc(t.name || t.lang || "Ses " + (i + 1)) + "</option>").join("");
}

// --- altyazı / CC: İngilizce öğrenmenin anahtarı ---
// İki kaynak vardır ve ikisi de gerekir:
//   1) manifest'te tanımlı altyazı parçaları  -> hls.subtitleTracks
//   2) yayının içine gömülü CEA-608/708 CC    -> video.textTracks (sonradan belirir)
let ccWanted = false;

function nativeCC() {
  return [...V.textTracks].filter(t => t.kind === "captions" || t.kind === "subtitles");
}
function hasAnySub() {
  return (hls && hls.subtitleTracks && hls.subtitleTracks.length > 0) || nativeCC().length > 0;
}
function refreshCCBtn() {
  const any = hasAnySub();
  $("#bcc").style.opacity = any ? "1" : ".45";
  $("#bcc").title = any ? "Altyazı aç/kapat (C)" : "Bu yayında altyazı bulunamadı";
  $("#bcc").classList.toggle("on", ccWanted && any);
}
function initSubs() {
  ccWanted = $("#autocc").checked;
  applyCC();
}
function applyCC() {
  if (!hls) return;
  const subs = hls.subtitleTracks || [];
  if (ccWanted && subs.length) {
    const en = subs.findIndex(x => /^en|eng|cc1|english/i.test((x.lang || "") + " " + (x.name || "")));
    hls.subtitleTrack = en >= 0 ? en : 0;
    hls.subtitleDisplay = true;
  } else if (!ccWanted) {
    hls.subtitleTrack = -1;
    hls.subtitleDisplay = false;
  }
  // gömülü CC parçaları
  for (const t of nativeCC()) {
    const isEn = !t.language || /^en/i.test(t.language) || /cc1|english|captions/i.test(t.label || "");
    t.mode = ccWanted && isEn ? "showing" : "disabled";
  }
  refreshCCBtn();
}
function setCC(on) { ccWanted = on; applyCC(); }

// CEA-608 parçaları yayın başladıktan saniyeler sonra belirebilir
V.textTracks.addEventListener("addtrack", () => setTimeout(applyCC, 60));

/** kartlardaki ve barın "şu an yayında" bilgisini tazeler */
function paintNow() {
  if (!EPG) return;
  document.querySelectorAll(".now[data-epg]").forEach(el => {
    const c = ALL[+el.dataset.epg];
    if (!c) return;
    const e = epgOf(c);
    if (e && e.cur) el.innerHTML = "<b>▸ " + esc(e.cur.title) + "</b>";
    else if (e && e.next) el.textContent = hhmm(e.next.st) + " " + e.next.title;
    else el.textContent = "";
  });
  if (CUR) {
    const e = epgOf(CUR);
    $("#nowprog").textContent = e && e.cur
      ? "▸ " + e.cur.title + (e.next ? "   ·   sonra " + hhmm(e.next.st) + " " + e.next.title : "")
      : "";
  }
}
setInterval(paintNow, 60000);

/** radyo oynatıcı panelini doldurur */
function paintRadio(c) {
  const box = $("#rlogo");
  box.innerHTML = "";
  if (c.logo) {
    const img = new Image();
    img.onerror = () => { box.innerHTML = ""; box.appendChild(ph(c.name)); };
    img.src = PROXY ? "/img?u=" + encodeURIComponent(c.logo) : c.logo;
    box.appendChild(img);
  } else box.appendChild(ph(c.name));
  $("#rname").textContent = c.name;
  const bits = [];
  if (c.codec) bits.push(c.codec);
  if (c.br) bits.push(c.br + " kbps");
  if (c.hls) bits.push("HLS");
  const m = META.find(x => x.co === c.co);
  if (m) bits.push(m.flag + " " + m.label);
  $("#rsub").textContent = bits.join("  ·  ");
}

function startStats() {
  clearInterval(statTimer);
  statTimer = setInterval(() => {
    if (!CUR) return;
    $("#req").classList.toggle("off", V.paused);
    if (isRadio() && !hls) {
      const buf = V.buffered.length ? Math.max(0, V.buffered.end(V.buffered.length - 1) - V.currentTime) : 0;
      $("#stat").textContent = (CUR.br ? CUR.br + " kbps · " : "") + "tampon " + buf.toFixed(1) + "s";
      return;
    }
    if (!hls) return;
    const lv = hls.levels && hls.levels[hls.currentLevel];
    const bw = Math.round((hls.bandwidthEstimate || 0) / 1000);
    const buf = V.buffered.length ? Math.max(0, V.buffered.end(V.buffered.length - 1) - V.currentTime) : 0;
    $("#stat").textContent = (lv && lv.height ? lv.height + "p · " : "") +
      (bw ? bw + " kbps · " : "") + "tampon " + buf.toFixed(1) + "s";
  }, 1000);
}

function zap(dir) {
  if (!VIEW.length) return;
  const i = CUR ? VIEW.findIndex(c => c.name === CUR.name) : -1;
  const n = VIEW[((i + dir) % VIEW.length + VIEW.length) % VIEW.length];
  if (n) { play(n); toast(n.name); }
}
function syncMute() { $("#bmute").textContent = V.muted || V.volume === 0 ? "🔇" : "🔊"; $("#bmute").classList.toggle("on", V.muted); }

function stop() {
  destroy(); CUR = null;
  $("#stage").classList.remove("on", "radio");
  document.title = "Cortexia TV";
  document.querySelectorAll(".card").forEach(e => e.classList.remove("playing"));
}

// ---------------- UI bindings ----------------
function bindUI() {
  let t;
  $("#q").oninput = () => { clearTimeout(t); t = setTimeout(render, 130); };
  $("#hdonly").onchange = render;
  $("#cconly").onchange = render;
  $("#hqonly").onchange = render;
  document.querySelectorAll(".md").forEach(b => {
    b.onclick = () => {
      if (MODE === b.dataset.m) return;
      MODE = b.dataset.m; store.set("mode", MODE);
      $("#q").value = "";
      applyMode();
    };
  });
  $("#autocc").onchange = () => { if (hls) setCC($("#autocc").checked); };

  $("#qual").onchange = (e) => { if (hls) hls.currentLevel = parseInt(e.target.value, 10); };
  $("#audio").onchange = (e) => { if (hls) hls.audioTrack = parseInt(e.target.value, 10); };
  $("#bcc").onclick = () => setCC(!$("#bcc").classList.contains("on"));
  $("#bfav").onclick = () => { if (CUR) toggleFav(fkey(CUR)); };
  $("#bmute").onclick = () => { V.muted = !V.muted; syncMute(); };
  $("#vol").oninput = (e) => { V.volume = parseFloat(e.target.value); V.muted = false; syncMute(); store.set("vol", V.volume); };
  $("#bfs").onclick = () => {
    const box = document.querySelector(".vidbox");
    if (document.fullscreenElement) document.exitFullscreen();
    else box.requestFullscreen().catch(() => {});
  };
  $("#bpip").onclick = async () => {
    try { document.pictureInPictureElement ? await document.exitPictureInPicture() : await V.requestPictureInPicture(); }
    catch { toast("Mini pencere desteklenmiyor"); }
  };
  $("#bclose").onclick = stop;
  $("#eretry").onclick = () => { if (CUR) play(CUR); };
  $("#enext").onclick = () => zap(1);
  V.ondblclick = () => $("#bfs").click();
  V.onwaiting = () => showSpin("Arabelleğe alınıyor…");
  V.onplaying = () => { hideSpin(); hideErr(); };

  const v = store.get("vol", 1);
  V.volume = v; $("#vol").value = v; syncMute();

  document.onkeydown = (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
      if (e.key === "Escape") e.target.blur();
      return;
    }
    switch (e.key) {
      case " ": e.preventDefault(); V.paused ? V.play() : V.pause(); break;
      case "f": case "F": $("#bfs").click(); break;
      case "m": case "M": $("#bmute").click(); break;
      case "c": case "C": $("#bcc").click(); break;
      case "ArrowUp": e.preventDefault(); zap(-1); break;
      case "ArrowDown": e.preventDefault(); zap(1); break;
      case "ArrowRight": V.volume = Math.min(1, V.volume + .05); $("#vol").value = V.volume; syncMute(); break;
      case "ArrowLeft": V.volume = Math.max(0, V.volume - .05); $("#vol").value = V.volume; syncMute(); break;
      case "/": e.preventDefault(); $("#q").focus(); $("#q").select(); break;
      case "Escape": if (CUR) stop(); break;
    }
  };
}
</script>
</body>
</html>
